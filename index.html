<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Inventory of personal projects, hosting providers, databases, integrations and infrastructure costs." />
    <title>Infrastructure Dashboard</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('did.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>

    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 3.5h14v1.5H1zM1 7.25h14v1.5H1zM1 11h14v1.5H1z" /></svg>
      </button>
      <span class="brand-text">Infrastructure Dashboard</span>
    </header>

    <div id="scrim" class="scrim"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="assets/icons/favicon.svg" width="22" height="22" alt="" />
        <span>Infra Dashboard</span>
      </div>
      <nav id="nav" aria-label="Primary">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/projects" data-route="projects">Projects</a>
        <a href="#/providers" data-route="providers">Providers</a>
        <a href="#/costs" data-route="costs">Costs</a>
        <a href="#/maintenance" data-route="maintenance">Maintenance <span id="nav-maintenance-count" class="count" hidden></span></a>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="btn btn-block" type="button" aria-label="Change theme">Theme</button>
        <p id="updated" class="muted small"></p>
      </div>
    </aside>

    <main class="main">
      <div id="warnings" class="notice notice-warn" role="status" hidden><span id="warnings-text"></span> (see console)</div>
      <div id="view" tabindex="-1">
        <noscript><p>This dashboard needs JavaScript enabled.</p></noscript>
        <p class="muted">Loading…</p>
      </div>
    </main>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
