<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Inventory of personal projects, hosting providers, databases, integrations and infrastructure costs." />
    <title>Infrastructure Dashboard</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('did.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>

    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 3.5h14v1.5H1zM1 7.25h14v1.5H1zM1 11h14v1.5H1z" /></svg>
      </button>
      <span class="brand-text">Infrastructure Dashboard</span>
    </header>

    <div id="scrim" class="scrim"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="assets/icons/favicon.svg" width="22" height="22" alt="" />
        <span>Infra Dashboard</span>
      </div>
      <nav id="nav" aria-label="Primary">
        <a href="#/overview" data-route="overview"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="3.5"/><rect x="9" y="7.5" width="5" height="6.5"/><rect x="2" y="9" width="5" height="5"/></svg><span>Overview</span></a>
        <a href="#/projects" data-route="projects"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg><span>Projects</span></a>
        <a href="#/providers" data-route="providers"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4" rx="1"/><rect x="2" y="9.5" width="12" height="4" rx="1"/><path d="M4.5 4.5h.01M4.5 11.5h.01"/></svg><span>Providers</span></a>
        <a href="#/costs" data-route="costs"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5v7M9.8 6.2c-.4-.5-1-.7-1.8-.7-1 0-1.8.5-1.8 1.3s.8 1.1 1.8 1.2 1.8.4 1.8 1.3-.8 1.3-1.8 1.3c-.8 0-1.5-.3-1.9-.8"/></svg><span>Costs</span></a>
        <a href="#/maintenance" data-route="maintenance"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 8.2l1.7 1.7 3.3-3.6"/></svg><span>Maintenance</span><span id="nav-maintenance-count" class="count" hidden></span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="seg" role="group" aria-label="Theme">
          <button type="button" data-theme-set="system" aria-pressed="false" aria-label="System theme" title="System"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 13.5h4M8 11v2.5"/></svg></button>
          <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light theme" title="Light"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1"/></svg></button>
          <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 9.6A5.5 5.5 0 0 1 6.4 2.8a5.5 5.5 0 1 0 6.8 6.8z"/></svg></button>
        </div>
        <p id="updated" class="muted small"></p>
      </div>
    </aside>

    <main class="main">
      <div id="warnings" class="notice notice-warn" role="status" hidden><span id="warnings-text"></span> (see console)</div>
      <div id="view" tabindex="-1">
        <noscript><p>This dashboard needs JavaScript enabled.</p></noscript>
        <p class="muted">Loading…</p>
      </div>
    </main>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
